name: ThreadMyMail Release

on:
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for git tag operations

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      # ── Keystore for release signing ────────────────────────────────────
      # When THMMY_KEYSTORE_BASE64 is set (GitHub Actions secrets), the build
      # is properly signed. Without it the plugin logs a warning and Gradle
      # falls back to debug signing (fine for local testing, NOT for distribution).
      - name: Prepare keystore
        if: env.THMMY_KEYSTORE_BASE64 != ''
        env:
          THMMY_KEYSTORE_BASE64: ${{ secrets.THMMY_KEYSTORE_BASE64 }}
        run: |
          echo "$THMMY_KEYSTORE_BASE64" | base64 -d > android/app/threadmymail.keystore
          echo "keystore ready: $(ls -lh android/app/threadmymail.keystore)"

      # Cache Gradle artifacts.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile-app/android/gradle/wrapper/gradle-wrapper.properties', 'mobile-app/package-lock.json') }}
          restore-keys: gradle-

      # ── Native generation + build ───────────────────────────────────────
      - name: Prebuild Android
        env:
          THMMY_KEYSTORE_FILE: ${{ secrets.THMMY_KEYSTORE_FILE }}
          THMMY_KEYSTORE_PASSWORD: ${{ secrets.THMMY_KEYSTORE_PASSWORD }}
          THMMY_KEY_ALIAS: ${{ secrets.THMMY_KEY_ALIAS }}
          THMMY_KEY_PASSWORD: ${{ secrets.THMMY_KEY_PASSWORD }}
        run: npx expo prebuild --platform android --clean
        timeout-minutes: 30

      - name: Typecheck
        run: npx tsc --noEmit
        timeout-minutes: 5

      - name: Generate release APK
        working-directory: mobile-app/android
        env:
          THMMY_KEYSTORE_FILE: ${{ secrets.THMMY_KEYSTORE_FILE }}
          THMMY_KEYSTORE_PASSWORD: ${{ secrets.THMMY_KEYSTORE_PASSWORD }}
          THMMY_KEY_ALIAS: ${{ secrets.THMMY_KEY_ALIAS }}
          THMMY_KEY_PASSWORD: ${{ secrets.THMMY_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
        timeout-minutes: 30

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK"
            find android -name "*.apk" -type f 2>/dev/null
            exit 1
          fi
          echo "APK: $(ls -lh $APK)"
          # Signed APKs have a signature block; debug APKs have none.
          if unzip -l "$APK" | grep -q "META-INF/CERT.RSA|META-INF/CERT.DSA"; then
            echo "✓ APK is properly signed (release keystore)"
          else
            echo "⚠ APK is DEBUG-SIGNED — set keystore secrets to produce a distributable build"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreadMyMail-release
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # ── GitHub Release ───────────────────────────────────────────────────
      - name: Create GitHub Release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.TAG }}"
          APK="mobile-app/android/app/build/outputs/apk/release/app-release.apk"

          gh release create "$TAG" "$APK" \
            --title "ThreadMyMail $TAG" \
            --notes "Release $TAG. Download the APK and install it on your Android device. Requires an app password for your email provider and your own AI model key."
          echo "✓ Release $TAG created at https://github.com/$GITHUB_REPOSITORY/releases/$TAG"