name: ThreadMyMail Android Build

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Cache Gradle artifacts keyed on the wrapper properties + lockfile.
      # The android/ directory is generated by `expo prebuild` and does not
      # exist before the first build, so the restore-keys fallback is required.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('mobile-app/android/gradle/wrapper/gradle-wrapper.properties', 'mobile-app/**/gradle.lockfile') }}
          restore-keys: |
            gradle-

      # Generate the native Android project from app.json / package.json.
      # --clean wipes any stale native config so the build reflects the
      # current Expo config. The android/ directory is created by this step.
      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean
        timeout-minutes: 30

      - name: Typecheck
        run: npx tsc --noEmit

      # Build the release APK. Release bundles the JS into the APK (debug
      # builds expect Metro and fail with "Unable to load script" on-device).
      # Gradle is invoked from the generated android/ directory.
      - name: Generate APK
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease
        timeout-minutes: 30

      - name: Verify APK exists
        run: |
          if [ ! -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "APK not found at expected path"
            find android -name "*.apk" -type f 2>/dev/null
            exit 1
          fi
          echo "APK verified: $(ls -lh android/app/build/outputs/apk/release/app-release.apk)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ThreadMyMail-release
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 7
