<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="40" height="40" role="img" aria-label="ThreadMyMail">
  <title>ThreadMyMail</title>
  <defs>
    <linearGradient id="tmm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060e20" />
      <stop offset="100%" stop-color="#131b2e" />
    </linearGradient>
    <linearGradient id="tmm-env" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c0c1ff" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#tmm-bg)" />
  <!-- Envelope, traced from the same geometry as the rasterised PWA icons. -->
  <rect x="3" y="8" width="26" height="17" rx="4" fill="url(#tmm-env)" opacity="0.92" />
  <path d="M4.5 10.5 16 18.5l11.5-8" fill="none" stroke="#e8eaff" stroke-width="2.3"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  <!-- The pulse, offset up-right: something running behind the mail. -->
  <path d="M21 4.5h2.5l1.2 3 1.2-3H28" fill="none" stroke="#7bd0ff" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round" />
</svg>
