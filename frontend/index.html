<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ThreadMyMail — AI-Powered Email Harness</title>
  <meta name="description" content="ThreadMyMail — an autonomous assistant that works your inbox. Millo triages, drafts and acts while you don't. Download the Android app; your credentials never leave your phone." />

  <!-- Open Graph / Twitter card. Without these, every share renders as a bare
       URL: Slack, iMessage and LinkedIn all fall back to no image at all.
       og-image.jpg is 1200x630 (the OG minimum) and carries the logo. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="ThreadMyMail" />
  <meta property="og:title" content="ThreadMyMail — Your inbox, orchestrated by an agent" />
  <meta property="og:description" content="An autonomous assistant that works your inbox. Millo triages, drafts and acts while you don't. On-device, no server, bring your own model key." />
  <meta property="og:image" content="https://threadmymail.omixsystems.store/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="ThreadMyMail — an envelope marked with an @ and TMM, on a dark navy background" />
  <meta property="og:url" content="https://threadmymail.omixsystems.store/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ThreadMyMail — Your inbox, orchestrated by an agent" />
  <meta name="twitter:description" content="An autonomous assistant that works your inbox. On-device, no server, bring your own model key." />
  <meta name="twitter:image" content="https://threadmymail.omixsystems.store/og-image.jpg" />
  <meta name="twitter:image:alt" content="ThreadMyMail — an envelope marked with an @ and TMM, on a dark navy background" />

  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="icon" type="image/png" href="/pwa-192x192.png" sizes="192x192" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="theme-color" content="#0b1326" />

  <!--
    Install metadata.

    The theme-color above, the manifest's theme_color, and --surface-low in
    styles/silk.css must agree; when they drift the installed app gets a title
    bar in a different colour from the app, which is the single most visible
    way to look unfinished on a home screen.

    apple-mobile-web-app-* are still what iOS reads. black-translucent is only
    safe alongside viewport-fit=cover and the env(safe-area-inset-*) padding in
    silk.css — without those it would lay the UI out underneath the status bar.

    No manifest link here: vite-plugin-pwa injects one at build time.
  -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ThreadMyMail" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Silk design system: Space Grotesk for display, Plus Jakarta Sans for body. -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <!--
    Material Symbols is not optional decoration here: .ms renders icon NAMES as
    ligature glyphs, so without this font every icon in the app displays as the
    literal word "auto_awesome" and so on.

    display=block is deliberate. With the default swap, the browser paints those
    ligature words during the font round-trip and then reflows the whole UI when
    the font lands. Blocking is a few hundred ms of invisible icon versus a
    visible flash of gibberish.
  -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block" rel="stylesheet" />
</head>
<body class="silk">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
